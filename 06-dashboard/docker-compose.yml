services:
  api:
    build: .
    ports:
      - "3006:3000"
    networks:
      - enterprise-net
    environment:
      - REDIS_URL=redis://dashboard-redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  db:
    image: mongo:6
    networks:
      - enterprise-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - dashboard-mongo:/data/db

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - enterprise-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - dashboard-redis:/data

volumes:
  dashboard-mongo:
  dashboard-redis:

networks:
  enterprise-net:
    external: true
